name: validate

# Render every model .scad with OpenSCAD and check the resulting mesh is
# watertight / 2-manifold. Validates geometry properties, not exact bytes
# (OpenSCAD STL output isn't deterministic enough to byte-compare).

on:
  pull_request:
    paths:
      - "**.scad"
      - "**.stl"
      - "**.png"
      - "**README.md"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  render-validate:
    runs-on: ubuntu-latest
    # A stalled apt mirror once wedged this job for over an hour on the install
    # step, and without a cap it would have run to the 6-hour default. A whole
    # run is ~6 minutes, so 25 fails loudly while leaving plenty of headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # A pinned OpenSCAD development snapshot, not Ubuntu's 2021.01 — the last
      # stable release, which disagrees with current builds about what's
      # manifold. Version + sha256 live in tools/install_openscad.sh (shared
      # with release.yml); it extracts the AppImage, so no FUSE. The earlier
      # ppa:openscad/releases attempt (658bc7c) 404'd on noble and broke every
      # PR. The dev machine's own 2026.09.23 build renders identical volumes
      # and bounding boxes (all 121 model files, #166), so a local
      # tools/render.sh is the CI check. Anywhere else, reproduce it with:
      #   docker run --rm --platform linux/amd64 -v "$PWD":/w -w /w ubuntu:24.04 \
      #     bash -c 'tools/install_openscad.sh && tools/render.sh'
      - name: Install OpenSCAD + mesh validator
        # Its own tighter cap: this step is ~1 minute healthy, so 10 separates
        # "mirror is stalling" from "a model is slow to render" without reading
        # logs.
        timeout-minutes: 10
        run: |
          tools/install_openscad.sh
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Runs before the render so a missing README or catalog row is reported in
      # seconds rather than after a full model render.
      - name: Check the catalog matches the model dirs
        run: python3 tools/check_catalog.py

      - name: Render + validate models
        run: tools/render.sh
