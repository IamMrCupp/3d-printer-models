name: validate

# Render every model .scad with OpenSCAD and check the resulting mesh is
# watertight / 2-manifold. Validates geometry properties, not exact bytes
# (OpenSCAD STL output isn't deterministic enough to byte-compare).

on:
  pull_request:
    paths:
      - "**.scad"
      - "**.stl"
      - "tools/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  render-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Ubuntu ships openscad 2021.01, which is ~5 years and one CGAL major
      # behind what anyone actually models with. Its CGAL emits non-manifold
      # meshes for geometry that is clean on a current build, so CI was failing
      # valid models — and worse, nothing reproduced locally. Use the nightly
      # PPA so CI matches a modern renderer.
      - name: Install OpenSCAD + mesh validator
        run: |
          sudo add-apt-repository -y ppa:openscad/releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad-nightly xvfb
          openscad-nightly --version
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Render + validate models
        env:
          OPENSCAD: openscad-nightly
        run: xvfb-run -a tools/render.sh
